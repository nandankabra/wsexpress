openapi: 3.1.0
info:
  title: ShipTrack User Service
  version: "1.0.0"
  description: Customer profile management.
servers:
  - url: http://localhost:8002
  - url: http://localhost:8000/api/v1/customers
    description: Via API Gateway
tags:
  - name: Customers
paths:
  /api/v1/customers/me:
    get:
      tags: [Customers]
      summary: Get the current customer's profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomerProfile' } } }
        '304': { description: Not Modified (ETag match) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Customers]
      summary: Create or update the current customer's profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertProfileRequest' }
      responses:
        '200':
          description: Profile saved
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomerProfile' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List customer profiles (admin, cursor-paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Page of customer profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CustomerProfile' } }
                  pagination: { type: object }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/customers/{userId}:
    get:
      tags: [Customers]
      summary: Get a customer profile by user id (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Profile
          content: { application/json: { schema: { $ref: '#/components/schemas/CustomerProfile' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    UpsertProfileRequest:
      type: object
      required: [fullName, email]
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
    CustomerProfile:
      allOf:
        - $ref: '#/components/schemas/UpsertProfileRequest'
        - type: object
          properties:
            userId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: object }
  responses:
    BadRequest:
      description: Validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Insufficient role permissions
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
