openapi: 3.1.0
info:
  title: ShipTrack CRM Service
  version: "1.0.0"
  description: Customer/shipment/carrier analytics for the admin CRM portal (MongoDB).
servers:
  - url: http://localhost:8008
  - url: http://localhost:8000/api/v1/crm
    description: Via API Gateway
tags:
  - name: CRM
paths:
  /api/v1/crm/events:
    post:
      tags: [CRM]
      summary: Ingest a business event (server-to-server, or admin action)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AnalyticsEvent' } } }
      responses:
        '201': { description: Recorded }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/crm/summary:
    get:
      tags: [CRM]
      summary: Aggregate event counts and delivery rate (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Summary }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/crm/customers/top:
    get:
      tags: [CRM]
      summary: Top customers by shipment volume (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
      responses:
        '200': { description: Top customers }
  /api/v1/crm/carriers/performance:
    get:
      tags: [CRM]
      summary: Carrier delivery performance (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
      responses:
        '200': { description: Carrier performance }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    AnalyticsEvent:
      type: object
      required: [eventType, entityId]
      properties:
        eventType: { type: string, enum: [CUSTOMER_REGISTERED, CARRIER_VERIFIED, SHIPMENT_CREATED, SHIPMENT_DELIVERED, SHIPMENT_CANCELLED] }
        entityId: { type: string }
        customerId: { type: string }
        carrierId: { type: string }
        metadata: { type: object }
    Error:
      type: object
      properties:
        error: { type: object }
  responses:
    BadRequest: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Insufficient permissions, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
