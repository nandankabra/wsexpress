server:
  port: 8084

spring:
  application:
    name: quote-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
    # The LoadBalancer's own retry mechanism would otherwise stack with Resilience4j's retry
    # below, multiplying worst-case latency; Resilience4j is the single source of truth here.
    loadbalancer:
      retry:
        enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quote_db}
    username: ${DB_USER:shiptrack}
    password: ${DB_PASSWORD:shiptrack}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

feign:
  client:
    config:
      # Must match the @FeignClient name exactly (case-sensitive) — "COUNTRY-SERVICE", the
      # Eureka service id, not the lowercase-hyphen service name. A mismatch here silently
      # falls back to Feign's much longer built-in defaults instead of these values.
      COUNTRY-SERVICE:
        connect-timeout: 800
        read-timeout: 1000

# Kept well under the Gateway's 5s route response-timeout: worst case here is two attempts of
# ~1s each plus a 200ms backoff (~2.2s), so a struggling Country Service trips *this* service's
# own circuit breaker and returns a fallback quote well before the Gateway would ever consider
# Quote Service itself unresponsive and fall back to its coarser /fallback/quote.
resilience4j:
  retry:
    instances:
      countryService:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - java.io.IOException
          - feign.RetryableException
  circuitbreaker:
    instances:
      countryService:
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

springdoc:
  swagger-ui:
    path: /swagger-ui.html
