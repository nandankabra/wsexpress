# ==============================================================================
# Render Blueprint for ShipTrack (Production Cloud Architecture)
#
# Deploy Instructions:
# 1. Commit and push this repo to GitHub.
# 2. In Render Dashboard: Click "New +" -> "Blueprint" -> select this repository.
# 3. Fill in the "shiptrack-cloud-env" Environment Group values (Neon, Aiven, Mongo).
# 4. Click "Apply" to launch all services.
# ==============================================================================

envVarGroups:
  - name: shiptrack-cloud-env
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: aa4a3aba459a0083841d87b83f6c36e414cd3f4915d7276eae3ecef2f77f29f6
      - key: JWT_REFRESH_SECRET
        value: 17a01e132381ea1341aeff92660cfe1ad4d11cf9c01fd000e2c5efb90c6f4646
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d
      - key: CORS_ORIGIN
        value: "https://shiptrack-frontend.onrender.com,http://localhost:3001"
      - key: DATABASE_URL
        sync: false # Paste your Neon PostgreSQL URL
      - key: MYSQL_URL
        sync: false # Paste your Aiven MySQL URL
      - key: MONGO_URL
        sync: false # Paste your MongoDB Atlas URL
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false # Paste your Gmail address (e.g. guptaabhinav697@gmail.com)
      - key: SMTP_PASSWORD
        sync: false # Paste your Gmail App Password
      - key: SMTP_FROM
        value: "ShipTrack <guptaabhinav697@gmail.com>"
      - key: ADMIN_EMAIL
        value: admin@shiptrack.com
      - key: ADMIN_PASSWORD
        sync: false # Enter your Admin Password (e.g. Admin@ShipTrack2026!)

services:
  - type: web
    name: shiptrack-auth-service
    runtime: docker
    dockerfilePath: services/auth-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8001
      - key: CRM_SERVICE_URL
        fromService: { name: shiptrack-crm-service, type: web, property: hostport }
      - key: NOTIFICATION_SERVICE_URL
        fromService: { name: shiptrack-notification-service, type: web, property: hostport }

  - type: web
    name: shiptrack-user-service
    runtime: docker
    dockerfilePath: services/user-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8002

  - type: web
    name: shiptrack-carrier-service
    runtime: docker
    dockerfilePath: services/carrier-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8003
      - key: CRM_SERVICE_URL
        fromService: { name: shiptrack-crm-service, type: web, property: hostport }

  - type: web
    name: shiptrack-shipment-service
    runtime: docker
    dockerfilePath: services/shipment-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8004
      - key: PRICING_SERVICE_URL
        fromService: { name: shiptrack-pricing-service, type: web, property: hostport }
      - key: TRACKING_SERVICE_URL
        fromService: { name: shiptrack-tracking-service, type: web, property: hostport }
      - key: CRM_SERVICE_URL
        fromService: { name: shiptrack-crm-service, type: web, property: hostport }

  - type: web
    name: shiptrack-pricing-service
    runtime: docker
    dockerfilePath: services/pricing-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8006
      - key: LOCATION_SERVICE_URL
        fromService: { name: shiptrack-location-service, type: web, property: hostport }

  - type: web
    name: shiptrack-location-service
    runtime: docker
    dockerfilePath: services/location-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8007

  - type: web
    name: shiptrack-tracking-service
    runtime: docker
    dockerfilePath: services/tracking-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8005

  - type: web
    name: shiptrack-crm-service
    runtime: docker
    dockerfilePath: services/crm-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8008

  - type: web
    name: shiptrack-audit-service
    runtime: docker
    dockerfilePath: services/audit-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8009

  - type: web
    name: shiptrack-notification-service
    runtime: docker
    dockerfilePath: services/notification-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8010

  - type: web
    name: shiptrack-graphql-service
    runtime: docker
    dockerfilePath: services/graphql-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8011
      - key: SHIPMENT_SERVICE_URL
        fromService: { name: shiptrack-shipment-service, type: web, property: hostport }
      - key: TRACKING_SERVICE_URL
        fromService: { name: shiptrack-tracking-service, type: web, property: hostport }
      - key: USER_SERVICE_URL
        fromService: { name: shiptrack-user-service, type: web, property: hostport }

  - type: web
    name: shiptrack-api-gateway
    runtime: docker
    dockerfilePath: services/api-gateway/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: shiptrack-cloud-env
      - key: PORT
        value: 8000
      - key: AUTH_SERVICE_URL
        fromService: { name: shiptrack-auth-service, type: web, property: hostport }
      - key: USER_SERVICE_URL
        fromService: { name: shiptrack-user-service, type: web, property: hostport }
      - key: CARRIER_SERVICE_URL
        fromService: { name: shiptrack-carrier-service, type: web, property: hostport }
      - key: SHIPMENT_SERVICE_URL
        fromService: { name: shiptrack-shipment-service, type: web, property: hostport }
      - key: TRACKING_SERVICE_URL
        fromService: { name: shiptrack-tracking-service, type: web, property: hostport }
      - key: PRICING_SERVICE_URL
        fromService: { name: shiptrack-pricing-service, type: web, property: hostport }
      - key: LOCATION_SERVICE_URL
        fromService: { name: shiptrack-location-service, type: web, property: hostport }
      - key: CRM_SERVICE_URL
        fromService: { name: shiptrack-crm-service, type: web, property: hostport }
      - key: AUDIT_SERVICE_URL
        fromService: { name: shiptrack-audit-service, type: web, property: hostport }
      - key: NOTIFICATION_SERVICE_URL
        fromService: { name: shiptrack-notification-service, type: web, property: hostport }
      - key: GRAPHQL_SERVICE_URL
        fromService: { name: shiptrack-graphql-service, type: web, property: hostport }

  - type: web
    name: shiptrack-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    envVars:
      - key: API_GATEWAY_URL
        value: https://shiptrack-api-gateway.onrender.com
