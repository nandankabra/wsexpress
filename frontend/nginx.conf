server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/v1/ {
    proxy_pass ${API_GATEWAY_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /graphql {
    proxy_pass ${API_GATEWAY_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # React Router client-side routing: fall back to index.html for unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
