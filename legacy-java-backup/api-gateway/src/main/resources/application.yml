server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    config:
      fail-fast: false
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 5s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCB
                fallbackUri: forward:/fallback/auth
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@rateLimitKeyResolver}"

        # Must precede shipment-service: /api/shipments/{id}/events belongs to Tracking Service,
        # and Spring Cloud Gateway matches routes in declaration order (first match wins).
        - id: shipment-tracking-history
          uri: lb://TRACKING-SERVICE
          predicates:
            - Path=/api/shipments/*/events
          filters:
            - name: CircuitBreaker
              args:
                name: trackingServiceCB
                fallbackUri: forward:/fallback/tracking

        - id: shipment-service
          uri: lb://SHIPMENT-SERVICE
          predicates:
            - Path=/api/shipments/**
          filters:
            - name: CircuitBreaker
              args:
                name: shipmentServiceCB
                fallbackUri: forward:/fallback/shipment
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@rateLimitKeyResolver}"

        - id: tracking-events
          uri: lb://TRACKING-SERVICE
          predicates:
            - Path=/api/events/**
          filters:
            - name: CircuitBreaker
              args:
                name: trackingServiceCB
                fallbackUri: forward:/fallback/tracking
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@rateLimitKeyResolver}"

        - id: tracking-webhooks
          uri: lb://TRACKING-SERVICE
          predicates:
            - Path=/api/webhooks/**
          filters:
            - name: CircuitBreaker
              args:
                name: trackingServiceCB
                fallbackUri: forward:/fallback/tracking

        - id: quote-service
          uri: lb://QUOTE-SERVICE
          predicates:
            - Path=/api/quotes/**
          filters:
            - name: CircuitBreaker
              args:
                name: quoteServiceCB
                fallbackUri: forward:/fallback/quote
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@rateLimitKeyResolver}"

        - id: country-service
          uri: lb://COUNTRY-SERVICE
          predicates:
            - Path=/api/countries/**
          filters:
            - name: CircuitBreaker
              args:
                name: countryServiceCB
                fallbackUri: forward:/fallback/country

        - id: graphql-service
          uri: lb://GRAPHQL-SERVICE
          predicates:
            - Path=/api/graphql/**
          filters:
            - name: CircuitBreaker
              args:
                name: graphqlServiceCB
                fallbackUri: forward:/fallback/graphql

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationServiceCB
                fallbackUri: forward:/fallback/notification

# Paths reachable without a JWT.
security:
  public-paths:
    - /api/auth/register
    - /api/auth/login
    - /api/auth/validate
    - /api/webhooks/**
    - /actuator/**
    - /fallback/**

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    configs:
      default:
        timeout-duration: 4s

# Local fallback if the Config Server is unreachable (dev convenience only).
jwt:
  secret: "c2hpcHRyYWNrLXN1cGVyLXNlY3JldC1zaWduaW5nLWtleS1mb3ItandzLWhzMjU2LWRlbW8tb25seQ=="

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers
