server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:shiptrack}
    password: ${DB_PASSWORD:shiptrack}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Local fallback if the Config Server is unreachable (dev convenience only).
jwt:
  secret: "c2hpcHRyYWNrLXN1cGVyLXNlY3JldC1zaWduaW5nLWtleS1mb3ItandzLWhzMjU2LWRlbW8tb25seQ=="
  expiration-ms: 3600000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
