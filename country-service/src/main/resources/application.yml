server:
  port: 8085

spring:
  application:
    name: country-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: false

country:
  soap:
    endpoint-uri: ${COUNTRY_SOAP_ENDPOINT:http://localhost:8085/ws}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
